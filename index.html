<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake on LAN Online (Broadcast)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="card">
    <h2>Wake on LAN (Broadcast)</h2>
    <form id="wolForm">
        <div class="form-group">
            <label for="address">DDNS ou IP Externo:</label>
            <input type="text" id="address" placeholder="meuhost.ddns.net" required>
        </div>
        <div class="form-group">
            <label for="broadcast">IP de Broadcast Local:</label>
            <input type="text" id="broadcast" placeholder="192.168.1.255" required>
        </div>
        <div class="form-group">
            <label for="port">Porta UDP (Geralmente 7 ou 9):</label>
            <input type="number" id="port" value="9" required>
        </div>
        <button type="submit">Enviar via Broadcast 🚀</button>
    </form>
    <div id="status"></div>
</div>
<script>
    document.getElementById('wolForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = '';
        statusDiv.innerText = 'Enviando...';

        const data = {
            address: document.getElementById('address').value,
            broadcast: document.getElementById('broadcast').value,
            port: parseInt(document.getElementById('port').value)
        };

        try {
            const response = await fetch('/wake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (response.ok) {
                statusDiv.className = 'success';
                statusDiv.innerText = 'Pacote enviado com sucesso!';
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = 'Erro: ' + result.error;
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Erro ao conectar ao servidor.';
        }
    });
</script>
</body>
</html>
