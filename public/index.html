<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Wake on LAN (Estilo Depicus)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Online Wake On LAN</h1>
        <p>Insira os parâmetros para enviar o pacote mágico (Magic Packet) pela rede.</p>
        
        <form id="wolForm">
            <div class="input-group">
                <label for="mac">MAC Address:</label>
                <input type="text" id="mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            </div>

            <div class="input-group">
                <label for="ip">IP Address ou FQDN (Opcional):</label>
                <input type="text" id="ip" placeholder="Ex: 192.168.1.255 ou seu-dyns.net">
            </div>

            <div class="input-group">
                <label for="subnet">Subnet Mask (Opcional):</label>
                <input type="text" id="subnet" placeholder="255.255.255.255" value="255.255.255.255">
            </div>

            <div class="input-group">
                <label for="port">Remote Port (Opcional):</label>
                <input type="number" id="port" placeholder="9 ou 4343" value="9">
            </div>

            <div class="input-group">
                <label for="secureon">SecureON Password (Opcional):</label>
                <input type="text" id="secureon" placeholder="Senha se aplicável">
            </div>

            <button type="submit">Ligar / Wake Up</button>
        </form>

        <div id="status" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
