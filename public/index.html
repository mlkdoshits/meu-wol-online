<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Wake on LAN</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .header-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.75rem;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 1.25rem;
            padding: 0.85rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-icon">⚡</div>
        <h1>Wake on LAN</h1>
        <p>Insira os parâmetros de rede para enviar o pacote mágico e ligar o seu dispositivo à distância.</p>
        
        <form id="wolForm">
            <div class="input-group">
                <label for="mac">Endereço MAC *</label>
                <input type="text" id="mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            </div>

            <div class="input-group">
                <label for="ip">IP Address ou FQDN (Opcional)</label>
                <input type="text" id="ip" placeholder="Ex: 192.168.1.255 ou seu-dyns.net">
            </div>

            <div class="input-group">
                <label for="subnet">Subnet Mask (Opcional)</label>
                <input type="text" id="subnet" placeholder="255.255.255.255" value="255.255.255.255">
            </div>

            <div class="input-group">
                <label for="port">Remote Port (Opcional)</label>
                <input type="number" id="port" placeholder="9 ou 4343" value="9">
            </div>

            <div class="input-group">
                <label for="secureon">SecureON Password (Opcional)</label>
                <input type="text" id="secureon" placeholder="Senha se configurada">
            </div>

            <button type="submit">Ligar Computador</button>
        </form>

        <div id="status" class="hidden"></div>
    </div>

    <script>
        document.getElementById('wolForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const mac = document.getElementById('mac').value;
            const ip = document.getElementById('ip').value;
            const subnet = document.getElementById('subnet').value;
            const port = document.getElementById('port').value;
            const secureon = document.getElementById('secureon').value;
            
            const statusDiv = document.getElementById('status');

            statusDiv.className = 'loading';
            statusDiv.textContent = 'Enviando pacote mágico...';

            try {
                const response = await fetch('/api/wake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        mac, 
                        ip: ip || undefined, 
                        subnet: subnet || undefined, 
                        port: port || undefined, 
                        secureon: secureon || undefined 
                    })
                });

                const result = await response.json();

                statusDiv.className = result.success ? 'success' : 'error';
                statusDiv.textContent = result.message;
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
