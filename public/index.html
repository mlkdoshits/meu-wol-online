<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake on LAN - Dashboard</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --background: #0b0f19;
            --card-bg: #111827;
            --input-bg: #1f2937;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #374151;
        }

        h1 { font-size: 1.75rem; margin-top: 0; margin-bottom: 0.5rem; text-align: center; font-weight: 700; }
        p { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted); font-weight: 500; }
        
        input {
            width: 100%; padding: 0.85rem; border-radius: 0.6rem; border: 1px solid #4b5563;
            background-color: var(--input-bg); color: white; font-size: 1rem; box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        
        button {
            width: 100%; padding: 0.9rem; background-color: var(--primary); color: white;
            border: none; border-radius: 0.6rem; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 0.5rem;
        }

        button:hover { background-color: var(--primary-hover); }
        
        .status { margin-top: 1.25rem; padding: 0.85rem; border-radius: 0.6rem; font-size: 0.9rem; text-align: center; display: none; font-weight: 500; }
        .success { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #059669; }
        .error { background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #dc2626; }
    </style>
</head>
<body>

<div class="card">
    <h1>Wake on LAN Cloud ⚡</h1>
    <p>Ligue seus dispositivos remotamente</p>

    <form id="wolForm">
        <div class="form-group">
            <label for="mac">Endereço MAC do Computador</label>
            <input type="text" id="mac" placeholder="00:11:22:33:44:55" required 
                   pattern="^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$">
        </div>

        <div class="form-group">
            <label for="host">Endereço DDNS / IP de Transmissão</label>
            <input type="text" id="host" placeholder="exemplo.ddns.net" required>
        </div>

        <div class="form-group">
            <label for="port">Porta UDP (Padrão: 9)</label>
            <input type="number" id="port" value="9" min="1" max="65535" required>
        </div>

        <button type="submit">Ligar Computador</button>
    </form>

    <div id="statusMessage" class="status"></div>
</div>

<script>
    // Recupera dados salvos anteriormente no navegador ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('wol_mac')) document.getElementById('mac').value = localStorage.getItem('wol_mac');
        if(localStorage.getItem('wol_host')) document.getElementById('host').value = localStorage.getItem('wol_host');
        if(localStorage.getItem('wol_port')) document.getElementById('port').value = localStorage.getItem('wol_port');
    });

    document.getElementById('wolForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const mac = document.getElementById('mac').value.trim();
        const host = document.getElementById('host').value.trim();
        const port = document.getElementById('port').value.trim();
        const statusDiv = document.getElementById('statusMessage');

        // Salva os dados localmente para o próximo acesso
        localStorage.setItem('wol_mac', mac);
        localStorage.setItem('wol_host', host);
        localStorage.setItem('wol_port', port);

        statusDiv.style.display = 'block';
        statusDiv.className = 'status';
        statusDiv.innerText = 'Transmitindo Magic Packet...';

        try {
            const response = await fetch('/api/wake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mac, host, port: parseInt(port) })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                statusDiv.className = 'status success';
                statusDiv.innerText = '⚡ Sinal enviado com sucesso!';
            } else {
                throw new Error(data.error || 'Erro desconhecido na transmissão.');
            }
        } catch (error) {
            statusDiv.className = 'status error';
            statusDiv.innerText = 'Erro: ' + error.message;
        }
    });
</script>

</body>
</html>
