<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Wake on LAN</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: #0f172a;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .header-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        button {
            flex: 1;
            padding: 0.8rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        button.btn-secondary:hover {
            background-color: #475569;
        }

        button.btn-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
            flex: 0.4;
        }

        button.btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.3);
        }

        #status {
            margin-top: 1.25rem;
            padding: 0.85rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-icon">⚡</div>
        <h1>Wake on LAN</h1>
        <p>Selecione um dispositivo salvo ou informe o MAC e o IP/DDNS para ligar.</p>
        
        <div class="input-group">
            <label for="savedDevices">Dispositivos Salvos</label>
            <select id="savedDevices" onchange="carregarDispositivo()">
                <option value="">-- Novo Dispositivo / Selecionar --</option>
            </select>
        </div>

        <form id="wolForm">
            <div class="input-group">
                <label for="name">Nome do Dispositivo</label>
                <input type="text" id="name" placeholder="Ex: Meu PC Principal" required>
            </div>

            <div class="input-group">
                <label for="mac">Endereço MAC *</label>
                <input type="text" id="mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            </div>

            <div class="input-group">
                <label for="ip">IP Address ou DDNS (Opcional)</label>
                <input type="text" id="ip" placeholder="Ex: 192.168.1.50 ou meu-dominio.ddns.net">
            </div>

            <div class="input-group">
                <label for="port">Porta (Opcional)</label>
                <input type="number" id="port" placeholder="9" value="9">
            </div>

            <div class="input-group">
                <label for="secureon">SecureON Password (Opcional)</label>
                <input type="text" id="secureon" placeholder="Senha se aplicável">
            </div>

            <div class="btn-group">
                <button type="submit">Ligar Dispositivo</button>
                <button type="button" class="btn-secondary" onclick="salvarDispositivo()">Salvar</button>
                <button type="button" class="btn-danger" onclick="apagarDispositivo()" title="Excluir selecionado">🗑️</button>
            </div>
        </form>

        <div id="status" class="hidden"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', atualizarSelect);

        function obterDispositivos() {
            return JSON.parse(localStorage.getItem('wol_devices') || '{}');
        }

        function atualizarSelect() {
            const select = document.getElementById('savedDevices');
            const devices = obterDispositivos();
            
            select.innerHTML = '<option value="">-- Novo Dispositivo / Selecionar --</option>';
            for (let nome in devices) {
                let opt = document.createElement('option');
                opt.value = nome;
                opt.textContent = nome;
                select.appendChild(opt);
            }
        }

        function salvarDispositivo() {
            const name = document.getElementById('name').value.trim();
            const mac = document.getElementById('mac').value.trim();
            
            if (!name || !mac) {
                alert('Preencha pelo menos o Nome e o Endereço MAC para salvar.');
                return;
            }

            const devices = obterDispositivos();
            devices[name] = {
                mac,
                ip: document.getElementById('ip').value,
                port: document.getElementById('port').value,
                secureon: document.getElementById('secureon').value
            };

            localStorage.setItem('wol_devices', JSON.stringify(devices));
            atualizarSelect();
            document.getElementById('savedDevices').value = name;
            
            alert(`Dispositivo "${name}" salvo com sucesso!`);
        }

        function carregarDispositivo() {
            const nome = document.getElementById('savedDevices').value;
            if (!nome) {
                document.getElementById('wolForm').reset();
                document.getElementById('port').value = '9';
                return;
            }

            const devices = obterDispositivos();
            const dev = devices[nome];
            if (dev) {
                document.getElementById('name').value = nome;
                document.getElementById('mac').value = dev.mac || '';
                document.getElementById('ip').value = dev.ip || '';
                document.getElementById('port').value = dev.port || '9';
                document.getElementById('secureon').value = dev.secureon || '';
            }
        }

        function apagarDispositivo() {
            const nome = document.getElementById('savedDevices').value;
            if (!nome) {
                alert('Selecione um dispositivo salvo para excluir.');
                return;
            }

            if (confirm(`Deseja realmente excluir o dispositivo "${nome}"?`)) {
                const devices = obterDispositivos();
                delete devices[nome];
                localStorage.setItem('wol_devices', JSON.stringify(devices));
                atualizarSelect();
                document.getElementById('wolForm').reset();
            }
        }

        document.getElementById('wolForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const mac = document.getElementById('mac').value;
            const ip = document.getElementById('ip').value;
            const port = document.getElementById('port').value;
            const secureon = document.getElementById('secureon').value;
            
            const statusDiv = document.getElementById('status');

            statusDiv.className = 'loading';
            statusDiv.textContent = 'Enviando pacote mágico...';

            try {
                const response = await fetch('/api/wake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        mac, 
                        ip: ip || undefined, 
                        port: port || undefined, 
                        secureon: secureon || undefined 
                    })
                });

                const result = await response.json();

                statusDiv.className = result.success ? 'success' : 'error';
                statusDiv.textContent = result.message;
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
